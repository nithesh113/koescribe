[project]
name = "koescribe"
version = "0.1.0"
description = "Private local voice dictation using faster-whisper and LM Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "platformdirs>=4.11.8",
    "pyside6>=6.11.2",
]

[project.scripts]
koescribe = "koescribe.app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
